# Edit before copying to the Kindle.
# The server that serves the pages, with no trailing slash. Use the Pi's IP
# address; the Kindle can't resolve autotrader.local.
SERVER="http://192.168.1.50:8080"
# The "apps": each name is a page at $SERVER/<name>.png. A tap on the screen
# shows the next one. The first is shown on Start.
APPS="dashboard tasks"
# Seconds between refreshes of the page on screen (the Pi re-renders every 15 minutes)
INTERVAL=900
# 1 = stop the Kindle's own UI so it can't draw over the pages (also needed for tap-to-switch)
STOP_UI=1
# 1 = tap anywhere on the screen to switch app (only when STOP_UI=1)
TAP_SWITCH=1
# Touchscreen input device. Empty = find it in /proc/bus/input/devices.
TOUCH_DEV=""
