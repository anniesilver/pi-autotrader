# Edit before copying to the Kindle.
# Use the Pi's IP address; the Kindle can't resolve autotrader.local.
DASH_URL="http://192.168.1.50:8080/dashboard.png"
# Seconds between refreshes (the Pi re-renders every 15 minutes)
INTERVAL=900
# 1 = stop the Kindle's own UI so it can't draw over the dashboard (Stop dashboard brings it back)
STOP_UI=1
